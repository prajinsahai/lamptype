name = "lamptype-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Rooms are addressed by name, so everyone who opens the same link lands
# inside the same object.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed classes are the ones available without a paid Workers
# plan. Nothing here writes to storage - a room lives and dies in memory
# - but the backend still has to be declared.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Comma separated, no trailing slash, exact scheme and host. Leave it
# empty only for local `wrangler dev`, where there is no origin worth
# checking - anything reachable from the internet must set it.
ALLOWED_ORIGINS = "https://lamptype.example"
